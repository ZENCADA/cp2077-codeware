name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Build
        run: |
          xmake f -m release -y
          xmake -y
      - name: Package
        shell: pwsh
        run: ./tools/dist/package-mod.ps1 -ReleaseBin build/windows/x64/release/Codeware.dll
      - uses: actions/upload-artifact@v4
        with:
          name: Codeware
          path: build/dist/*.zip
          if-no-files-found: error
